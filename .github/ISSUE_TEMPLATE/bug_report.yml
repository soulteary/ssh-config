name: Bug report
description: Report a reproducible defect in parsing, editing, conversion, or CLI behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use the private advisory link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v3.0.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and minimal synthetic input
      description: Remove keys, tokens, usernames, and real hostnames.
      render: shell
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
