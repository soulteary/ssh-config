name: Release candidate

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full SHA currently at the tip of main (not a release tag SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable candidate
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_commit must be a full 40-character commit SHA"
            exit 1
          fi

          head_commit="$(git rev-parse HEAD)"
          main_commit="$(git rev-parse origin/main)"
          if [[ "${head_commit}" != "${EXPECTED_COMMIT}" ]]; then
            echo "::error::expected_commit ${EXPECTED_COMMIT} does not match checked-out main ${head_commit}"
            exit 1
          fi
          if [[ "${main_commit}" != "${EXPECTED_COMMIT}" ]]; then
            echo "::error::expected_commit ${EXPECTED_COMMIT} does not match origin/main ${main_commit}"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Add Syft to PATH
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/syft-bin"
          ln -s "${SYFT_CMD}" "${RUNNER_TEMP}/syft-bin/syft"
          printf '%s\n' "${RUNNER_TEMP}/syft-bin" >> "${GITHUB_PATH}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy -diff
          test "$(go list -m -f '{{ .Path }}')" = "github.com/soulteary/ssh-config/v3"
          command -v ssh
          ssh -V
          go test -race ./...
          go vet ./...

      - name: Scan dependencies
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: check

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: release --snapshot --clean

      - name: Smoke-test candidate container
        shell: bash
        run: |
          set -euo pipefail
          image="$(docker image ls --format '{{.Repository}}:{{.Tag}}' "ghcr.io/${GITHUB_REPOSITORY}" | head -n 1)"
          test -n "${image}"
          docker image inspect "${image}" >/dev/null
          docker run --rm "${image}" -version
