name: Quality

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/github-repo-card.png"
      - ".github/coverage.svg"
      - ".github/go-test-report.json"
      - ".github/goreportcard.svg"
      - ".github/goreportcard-report.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/github-repo-card.png"
      - ".github/coverage.svg"
      - ".github/go-test-report.json"
      - ".github/goreportcard.svg"

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: PR tests and local reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: go mod tidy -diff

      - name: Remove stale generated report evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./..."
          race: "true"
          coverage_threshold: "85"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "90"
          report: "true"
          commit: "false"
      - name: Upload raw test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-report-pr-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          if-no-files-found: error
          retention-days: 7

          include-hidden-files: true
        if: always()
  main:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: go mod tidy -diff

      - name: Race tests and coverage floor
        shell: bash
        run: |-
          set -euo pipefail
          mkdir -p .github/test-results
          go test -race -count=1 -json -covermode=atomic -coverprofile=.github/test-results/coverage.out ./... | tee .github/test-results/test.jsonl
          total=$(go tool cover -func=.github/test-results/coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          awk -v t="$total" 'BEGIN {exit !(t+0 >= 85)}'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies
        run: govulncheck ./...

      - name: Upload raw test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-report-${{ github.sha }}-${{ github.run_attempt }}
          path: .github/test-results/
          if-no-files-found: error
          retention-days: 7

          include-hidden-files: true
        if: always()
    name: Main race tests and vulnerability scan
    timeout-minutes: 30
