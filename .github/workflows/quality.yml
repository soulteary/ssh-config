name: Quality

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/github-repo-card.png"
      - ".github/coverage.svg"
      - ".github/go-test-report.json"
      - ".github/goreportcard.svg"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/github-repo-card.png"
      - ".github/coverage.svg"
      - ".github/go-test-report.json"
      - ".github/goreportcard.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    name: PR tests and local reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: go mod tidy -diff

      - name: Test and generate coverage report
        uses: soulteary/go-test-report-action@a5e77d563843af6c7a0cc3c573640fc2cd94934a # v1.1.0
        with:
          version: source
          coverage_threshold: "85"
          commit: "false"

      - name: Generate Go quality report
        uses: soulteary/goreportcard-action@9480215498804c431e4561b4d3e50d925e16b9bd # v1.1.0
        with:
          version: source
          threshold: "90"
          report: "false"
          commit: "false"

  main:
    if: github.event_name != 'pull_request'
    name: Main tests, local reports and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: go mod tidy -diff

      - name: Test with race detector and update coverage report
        uses: soulteary/go-test-report-action@a5e77d563843af6c7a0cc3c573640fc2cd94934a # v1.1.0
        with:
          version: source
          race: "true"
          coverage_threshold: "85"
          commit: "true"

      - name: Upload raw test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-test-report-${{ github.sha }}
          path: .github/test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies
        run: govulncheck ./...

      - name: Update Go quality report
        uses: soulteary/goreportcard-action@9480215498804c431e4561b4d3e50d925e16b9bd # v1.1.0
        with:
          version: source
          threshold: "90"
          report: "false"
          commit: "true"
