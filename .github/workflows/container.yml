name: Container

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linux/amd64/ssh-config .

      - name: Build image
        shell: bash
        run: docker build --build-arg TARGETPLATFORM=linux/amd64 --tag ssh-config:pr .

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Config.User}}' ssh-config:pr)" = "65532:65532"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' ssh-config:pr | grep -qx 'HOME=/home/ssh-config'
          docker run --rm ssh-config:pr -version
          runtime_home="$(mktemp -d)"
          printf 'Host default\n' > "${runtime_home}/config"
          chmod 0600 "${runtime_home}/config"
          docker run --rm --user "$(id -u):$(id -g)" -v "${runtime_home}:/home/ssh-config/.ssh:ro" ssh-config:pr -to-yaml | grep -q 'schemaVersion: 3'
          if docker run --rm --entrypoint /bin/bash ssh-config:pr -c true; then
            echo "::error::runtime image unexpectedly contains Bash"
            exit 1
          fi
