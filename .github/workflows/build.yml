name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-publish
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify source
        run: |
          go mod tidy -diff
          test "$(go list -m -f '{{ .Path }}')" = "github.com/soulteary/ssh-config/v3"
          command -v ssh
          ssh -V
          go test -race ./...
          go vet ./...
          go build -trimpath -o "${RUNNER_TEMP}/ssh-config" .
          "${RUNNER_TEMP}/ssh-config" -version

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies
        run: govulncheck ./...

      - name: Verify tagged Go module
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          GOBIN="${smoke_dir}/bin" go install "github.com/soulteary/ssh-config/v3@${GITHUB_REF_NAME}"
          "${smoke_dir}/bin/ssh-config" -version
          cd "${smoke_dir}"
          go mod init release-smoke
          go get "github.com/soulteary/ssh-config/v3@${GITHUB_REF_NAME}"
          printf '%s\n' \
            'package main' \
            'import "github.com/soulteary/ssh-config/v3/pkg/sshconfig"' \
            'func main() { _, _ = sshconfig.Parse([]byte("Host smoke\\n")) }' \
            > main.go
          go build .

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: check

      - name: Login to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release snapshot
        if: github.event_name == 'workflow_dispatch'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select release notes
        id: release-notes
        if: success() && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes}" ]]; then
            printf 'args=release --clean --release-notes %s\n' "${notes}" >> "${GITHUB_OUTPUT}"
          else
            printf 'args=release --clean\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        with:
          version: v2.18.0
          args: ${{ steps.release-notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test published container
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: docker run --rm "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}" -version
