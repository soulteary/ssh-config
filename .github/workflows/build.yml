name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish an existing immutable v* tag instead of building a snapshot
        required: false
        default: false
        type: boolean
      release_tag:
        description: Existing v* tag to publish when publish is enabled
        required: false
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-publish
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag || github.ref }}

      - name: Resolve release mode
        id: release
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish || false }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          publish=false
          tag=""
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            publish=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "${INPUT_PUBLISH}" == "true" ]]; then
            publish=true
            tag="${INPUT_RELEASE_TAG}"
          fi

          if [[ "${publish}" == "true" ]]; then
            if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::release_tag must be an existing semantic v* tag"
              exit 1
            fi
            git rev-parse --verify "refs/tags/${tag}^{commit}" >/dev/null
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${tag}^{commit}")"
          fi

          printf 'publish=%s\n' "${publish}" >> "${GITHUB_OUTPUT}"
          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Add Syft to PATH
        shell: bash
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          mkdir -p "${RUNNER_TEMP}/syft-bin"
          ln -s "${SYFT_CMD}" "${RUNNER_TEMP}/syft-bin/syft"
          printf '%s\n' "${RUNNER_TEMP}/syft-bin" >> "${GITHUB_PATH}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify source
        run: |
          go mod tidy -diff
          test "$(go list -m -f '{{ .Path }}')" = "github.com/soulteary/ssh-config/v3"
          command -v ssh
          ssh -V
          go test -race ./...
          go vet ./...
          go build -trimpath -o "${RUNNER_TEMP}/ssh-config" .
          "${RUNNER_TEMP}/ssh-config" -version

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan dependencies
        run: govulncheck ./...

      - name: Verify tagged Go module
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          smoke_dir="$(mktemp -d)"
          GOBIN="${smoke_dir}/bin" go install "github.com/soulteary/ssh-config/v3@${RELEASE_TAG}"
          "${smoke_dir}/bin/ssh-config" -version
          cd "${smoke_dir}"
          go mod init release-smoke
          go get "github.com/soulteary/ssh-config/v3@${RELEASE_TAG}"
          printf '%s\n' \
            'package main' \
            'import "github.com/soulteary/ssh-config/v3/pkg/sshconfig"' \
            'func main() { _, _ = sshconfig.Parse([]byte("Host smoke\\n")) }' \
            > main.go
          go build .

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: check

      - name: Login to Docker Hub
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release snapshot
        if: github.event_name == 'workflow_dispatch' && steps.release.outputs.publish != 'true'
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select release notes
        id: release-notes
        if: success() && steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "${notes}" ]]; then
            printf 'args=release --clean --release-notes %s\n' "${notes}" >> "${GITHUB_OUTPUT}"
          else
            printf 'args=release --clean\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        if: success() && steps.release.outputs.publish == 'true'
        with:
          version: v2.18.0
          args: ${{ steps.release-notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        if: success() && steps.release.outputs.publish == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Smoke-test published container
        if: success() && steps.release.outputs.publish == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${RELEASE_TAG}"
          docker run --rm "${image}" -version

          smoke_dir="$(mktemp -d)"
          printf 'Host smoke\n    User audit\n' > "${smoke_dir}/config"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${smoke_dir}:/ssh" \
            "${image}" \
            -to-yaml -src /ssh/config -dest /ssh/config.yaml
          test -r "${smoke_dir}/config.yaml"
          test "$(stat -c '%u:%g' "${smoke_dir}/config.yaml")" = "$(id -u):$(id -g)"
          grep -q '^schemaVersion: 3$' "${smoke_dir}/config.yaml"

          docker run --rm "soulteary/ssh-config:${RELEASE_TAG}" -version
